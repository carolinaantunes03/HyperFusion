experiment_name: "test"
task: "obstetrics"

model:
  model_name: HyperMultimodalMedViT

versions: "v0"

trainer:
  epochs: 100
  gpu: [1]
  overfit_batches: 0.0

checkpointing:
  enable: true
  ckpt_dir: "./experiments/mode_delivery_prediction/checkpoints"
  continue_train_from_ckpt: false

wandb:
  logs_dir: "./wandb_logs"
  project_name: "testing"
  enable: false
  sweep: false

lightning_wrapper:
  wrapper_name: "PlModelWrapObstetrics"
  optimizer:
    lr: 0.0001
    weight_decay: 0.00001
  loss:
    class_weights: [1.0, 1.0]



data_module:
  data_module_name: "ObstetricsDataModule"
  train_csv_path: Datasets/Obstetrics/retrospective-dataset/all_retrospective_data.csv
